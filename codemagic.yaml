workflows:
  ios-debug-build:
    name: iOS Debug IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Tuist and Generate Workspace
        script: |
          #!/bin/bash
          echo "Installing Tuist..."
          curl -Ls https://tuist.io | bash
          export PATH="$HOME/.tuist/bin:$PATH"
          echo "Generating Workspace..."
          tuist generate
      - name: Install Dependencies
        script: |
          #!/bin/bash
          npm install
      - name: Build Debug IPA
        script: |
          #!/bin/bash
          xcodebuild -workspace SniffBot.xcworkspace \
                     -scheme SniffBot \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
    artifacts:
      - build/ios/iphoneos/*.app
