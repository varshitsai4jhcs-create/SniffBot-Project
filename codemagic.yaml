workflows:
  ios-debug-build:
    name: iOS Debug IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Tuist via Mise
        script: |
          #!/bin/bash
          echo "Installing Mise (the recommended Tuist manager)..."
          curl https://jdx.dev | sh
          export PATH="$HOME/.local/share/mise/bin:$PATH"
          
          echo "Installing Tuist..."
          mise use -g tuist@latest
          
          echo "Verifying Tuist Installation..."
          tuist version
      - name: Generate Workspace
        script: |
          #!/bin/bash
          export PATH="$HOME/.local/share/mise/bin:$PATH"
          echo "Generating Workspace via Tuist..."
          tuist install
          tuist generate
      - name: Install Dependencies
        script: |
          #!/bin/bash
          npm install
      - name: Build Debug IPA
        script: |
          #!/bin/bash
          xcodebuild -workspace SniffBot.xcworkspace \
                     -scheme SniffBot \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
    artifacts:
      - build/ios/iphoneos/*.app
