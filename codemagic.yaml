workflows:
  ios-debug-build:
    name: iOS Debug IPA Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean and Build App Binary
        script: |
          #!/bin/bash
          echo "Compiling native project files..."
          xcodebuild -project SniffBot.xcodeproj \
                     -scheme SniffBot \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
      - name: Package App Into IPA Archive
        script: |
          #!/bin/bash
          echo "Creating Payload folder structure..."
          mkdir -p Payload
          
          echo "Copying compiled app package..."
          cp -R build_output/Build/Products/Debug-iphoneos/SniffBot.app Payload/
          
          echo "Zipping app into final IPA format..."
          zip -r SniffBot.ipa Payload
    artifacts:
      - "*.ipa"
